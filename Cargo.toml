[package]
name = "sasha"
version = "0.1.0"
edition = "2024"
description = "A terminal with Chrome-style vertical tabs, tab groups and workspaces, whose sessions keep running in the background like tmux"
repository = "https://github.com/hasangilak/sasha"
readme = "README.md"
keywords = ["terminal", "tui", "ratatui", "tabs", "tmux"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
crossterm = { version = "0.29.0", features = ["serde"] }
libc = "0.2.190"
portable-pty = "0.9.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
unicode-width = "0.2.2"
vt100 = "0.16.2"
